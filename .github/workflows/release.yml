name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: dispatch-linux-x64
          - target: bun-linux-arm64
            artifact: dispatch-linux-arm64
          - target: bun-darwin-x64
            artifact: dispatch-darwin-x64
          - target: bun-darwin-arm64
            artifact: dispatch-darwin-arm64
          - target: bun-windows-x64
            artifact: dispatch-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun build --compile --target=${{ matrix.target }} src/main.ts --outfile ${{ matrix.artifact }} --external @x402/fetch

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" artifacts/* \
            --title "Dispatch $tag" \
            --generate-notes
